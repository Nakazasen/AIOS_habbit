[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-habit"
version = "0.1.0"
description = "Local-first evidence-based personal memory platform"
requires-python = ">=3.11, <3.12"
dependencies = [
    "streamlit>=1.60.0",
    "streamlit-paste-button==0.1.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pymupdf4llm>=1.28.0",
    "Pillow>=10.0.0",
    "extract-msg>=0.49,<0.55",
    "pytesseract>=0.3.13",
    "nakazasen-ai-router==0.8.0",
    "graphifyy==0.9.32",
    "excaliflow==0.1.3",
]

[tool.uv.sources]
nakazasen-ai-router = { path = "vendor/wheels/nakazasen_ai_router-0.8.0-py3-none-any.whl" }
excaliflow = { path = "vendor/wheels/excaliflow-0.1.3-py3-none-any.whl" }

[project.optional-dependencies]
rag-semantic = [
    "fastembed>=0.8.0,<0.9.0",
]
rag-retrieval-lab = [
    "FlagEmbedding==1.3.5",
    "transformers==4.44.2",
    "sentence-transformers==3.1.1",
    "torch==2.5.1",
]
rag-ingestion-cpu = [
    "pdf-inspector>=0.2.6",
    "rapidocr>=3.0.0",
    "onnxruntime>=1.20.0,<2.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]
ocr-paddle-cpu = [
    "paddleocr>=3.0.0,<4.0.0",
    "paddlepaddle>=3.0.0,<4.0.0",
]
rag-ingestion-xls = [
    "xlrd>=2.0.1,<3.0.0",
]
document-deep-cpu = [
    "docling>=2.70.0,<3.0.0",
]
document-offline-max = [
    "docling>=2.70.0,<3.0.0",
    "marker-pdf>=0.2.14,<0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
aios-habit = "aios_habit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
faulthandler_timeout = 900
markers = [
    "slow: marks tests as slow",
]
