name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate professional documentation
        run: python scripts/check_docs.py
      - name: Compile source and tests
        run: python -m compileall src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Run local CLI audit
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m aios_habit.cli audit
      - name: Import supported Workspace Chat UI
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "import aios_habit.workspace_chat_app"
