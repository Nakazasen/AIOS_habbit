<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradSource" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="gradEngine" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="gradApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="600" y="45" fill="#38bdf8" font-size="24" font-weight="bold" text-anchor="middle">SƠ ĐỒ KIẾN TRÚC: WORKSPACE CHAT VỚI BGE-M3 HYBRID</text>
  <text x="600" y="70" fill="#94a3b8" font-size="14" text-anchor="middle">Kiến trúc 3 Tầng: Ingestion Đa định dạng ➔ Index Vector BGE-M3 ➔ Grounded AI Synthesis</text>

  <!-- COLUMN 1: SOURCES -->
  <g transform="translate(40, 95)">
    <rect width="320" height="520" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="45" rx="12" fill="url(#gradSource)"/>
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1. TÀI LIỆU GỐC (69 FILES)</text>

    <!-- Item 1 -->
    <rect x="15" y="60" width="290" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="85" fill="#38bdf8" font-size="14" font-weight="bold">📄 PDF &amp; Bản Scan</text>
    <text x="30" y="108" fill="#cbd5e1" font-size="12">Trích xuất bố cục Docling + RapidOCR</text>
    <text x="30" y="128" fill="#94a3b8" font-size="11">Nhận diện bảng biểu &amp; chữ tiếng Nhật/Việt</text>

    <!-- Item 2 -->
    <rect x="15" y="160" width="290" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="185" fill="#4ade80" font-size="14" font-weight="bold">📊 Excel (.xlsx / .xlsm)</text>
    <text x="30" y="208" fill="#cbd5e1" font-size="12">Cấu trúc hóa từng Sheet &amp; Cell Matrix</text>
    <text x="30" y="228" fill="#94a3b8" font-size="11">Giữ nguyên tọa độ cell và tiêu đề cột</text>

    <!-- Item 3 -->
    <rect x="15" y="260" width="290" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="285" fill="#fb923c" font-size="14" font-weight="bold">📑 PowerPoint / Word</text>
    <text x="30" y="308" fill="#cbd5e1" font-size="12">Slide Notes, Shape text, Headings</text>
    <text x="30" y="328" fill="#94a3b8" font-size="11">Phân tách phân đoạn văn bản tự nhiên</text>

    <!-- Item 4 -->
    <rect x="15" y="360" width="290" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="385" fill="#e2e8f0" font-size="14" font-weight="bold">📝 TXT / Markdown / CSV</text>
    <text x="30" y="408" fill="#cbd5e1" font-size="12">Dòng văn bản mã hóa UTF-8 trực tiếp</text>
    <text x="30" y="428" fill="#94a3b8" font-size="11">Không phụ thuộc engine phân tích ngoài</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 370 355 L 430 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="340" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="bold">Index 1 lần</text>

  <!-- COLUMN 2: BGE-M3 ENGINE -->
  <g transform="translate(440, 95)">
    <rect width="320" height="520" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="45" rx="12" fill="url(#gradEngine)"/>
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2. BGE-M3 HYBRID ENGINE</text>

    <!-- Item 1 -->
    <rect x="15" y="60" width="290" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="85" fill="#c084fc" font-size="14" font-weight="bold">✂️ Semantic Chunking</text>
    <text x="30" y="108" fill="#cbd5e1" font-size="12">Cửa sổ trượt: 512 – 1500 ký tự</text>
    <text x="30" y="128" fill="#cbd5e1" font-size="12">Overlap: 64 ký tự chống mất ngữ cảnh</text>
    <text x="30" y="148" fill="#94a3b8" font-size="11">Tự động nhận diện ranh giới bảng biểu</text>

    <!-- Item 2 -->
    <rect x="15" y="185" width="290" height="135" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="210" fill="#c084fc" font-size="14" font-weight="bold">🧠 BGE-M3 Local Subprocess</text>
    <text x="30" y="233" fill="#cbd5e1" font-size="12">• <b>Dense Vector:</b> 1024D Cosine</text>
    <text x="30" y="253" fill="#cbd5e1" font-size="12">• <b>Sparse Weights:</b> Từ khóa hiếm</text>
    <text x="30" y="273" fill="#cbd5e1" font-size="12">• Đa ngôn ngữ (Nhật / Việt / Anh)</text>
    <text x="30" y="295" fill="#94a3b8" font-size="11">Chạy tiến trình riêng biệt bảo vệ RAM</text>

    <!-- Item 3 -->
    <rect x="15" y="335" width="290" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="360" fill="#c084fc" font-size="14" font-weight="bold">💾 SQLite Vector &amp; FTS5</text>
    <text x="30" y="383" fill="#cbd5e1" font-size="12">Lưu Blob Vector + FTS5 Match</text>
    <text x="30" y="403" fill="#cbd5e1" font-size="12">Thuật toán RRF Fusion xếp hạng</text>
    <text x="30" y="423" fill="#94a3b8" font-size="11">Thời gian truy vấn cực nhanh: ~5s</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 770 355 L 830 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="800" y="340" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="bold">Top-9 Chunks</text>

  <!-- COLUMN 3: APP & AI -->
  <g transform="translate(840, 95)">
    <rect width="320" height="520" rx="12" fill="#1e293b" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="45" rx="12" fill="url(#gradApp)"/>
    <text x="160" y="28" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">3. WORKSPACE CHAT &amp; AI</text>

    <!-- Item 1 -->
    <rect x="15" y="60" width="290" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="85" fill="#34d399" font-size="14" font-weight="bold">🔌 Workspace Chat Adapter</text>
    <text x="30" y="108" fill="#cbd5e1" font-size="12">workspace_chat_rag_v2_adapter.py</text>
    <text x="30" y="128" fill="#cbd5e1" font-size="12">Kết nối trực tiếp SQLite Index</text>
    <text x="30" y="148" fill="#94a3b8" font-size="11">Không tốn thời gian cold-start OCR lại</text>

    <!-- Item 2 -->
    <rect x="15" y="175" width="290" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#34d399" font-size="14" font-weight="bold">🛡️ BrainGateway Cổng Kiểm Soát</text>
    <text x="30" y="223" fill="#cbd5e1" font-size="12">Đóng gói Top-9 đoạn bằng chứng</text>
    <text x="30" y="243" fill="#cbd5e1" font-size="12">Lọc sạch nhiễu &amp; cắt gọt token</text>
    <text x="30" y="263" fill="#94a3b8" font-size="11">Bảo vệ quyền riêng tư dữ liệu</text>

    <!-- Item 3 -->
    <rect x="15" y="300" width="290" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="325" fill="#34d399" font-size="14" font-weight="bold">🤖 AI Router (DeepSeek / Gemini)</text>
    <text x="30" y="348" fill="#cbd5e1" font-size="12">Khóa chặt vào 9 bằng chứng trích xuất</text>
    <text x="30" y="368" fill="#cbd5e1" font-size="12">Sinh câu trả lời có trích dẫn nguồn</text>
    <text x="30" y="388" fill="#cbd5e1" font-size="12">Cam kết không bịa đặt (Zero Hallucination)</text>
    <text x="30" y="418" fill="#38bdf8" font-size="12" font-weight="bold">💡 Kết quả hoàn chỉnh: ~10 giây</text>
  </g>
</svg>
